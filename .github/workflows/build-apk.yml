name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/downloads/**'
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Make Gradlew Executable
        run: |
          chmod +x ./gradlew || true

      - name: Create debug.keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK to Downloads
        run: |
          mkdir -p public/downloads
          cp app/build/outputs/apk/debug/app-debug.apk public/downloads/zoomdz.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoomdz-latest-apk
          path: public/downloads/zoomdz.apk

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "ZoomDz Android App - Latest Release v1.5.0"
          body: "النسخة الأصلية الرسمية لتطبيق ZoomDz للهواتف الذكية (Android Native APK v1.4.0). تحديثات تطبيق WebView مباشر لمنصة ZoomDz، يعرض أحدث محتوى وشعار وصور المنصة تلقائيًا دون الحاجة لتحديث التطبيق."
          draft: false
          prerelease: false
          files: public/downloads/zoomdz.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/zoomdz.apk
          git diff-index --quiet HEAD || git commit -m "build: auto-generate latest android apk [skip ci]"
          git push origin main

