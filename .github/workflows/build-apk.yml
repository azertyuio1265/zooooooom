name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/downloads/**'
      - 'dist/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: gradle wrapper

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Copy APK to Downloads
        run: |
          mkdir -p public/downloads
          cp app/build/outputs/apk/debug/app-debug.apk public/downloads/zoomdz.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/zoomdz.apk
          git diff-index --quiet HEAD || git commit -m "build: auto-generate latest android apk [skip ci]"
          git push origin main
